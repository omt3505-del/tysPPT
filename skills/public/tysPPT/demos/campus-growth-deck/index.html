<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大学四年成长路线图 · tysPPT</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="deck" class="deck" tabindex="0">
      <div class="campus-sky"></div>
      <div class="campus-grid"></div>
      <canvas id="motionCanvas" aria-hidden="true"></canvas>

      <div class="progress">
        <div id="progressBar"></div>
      </div>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark">LP</span>
          <span>tysPPT</span>
        </div>
        <div id="sectionLabel" class="section-label"></div>
      </header>

      <main id="slideRoot" class="slide-root"></main>

      <aside id="speakerNote" class="speaker-note"></aside>

      <footer class="toolbar">
        <button id="prevBtn" class="nav-btn" type="button" aria-label="上一页">←</button>
        <div id="dotNav" class="dot-nav" aria-label="幻灯片导航"></div>
        <button id="playBtn" class="nav-btn play" type="button" aria-label="自动播放">▶</button>
        <button id="nextBtn" class="nav-btn" type="button" aria-label="下一页">→</button>
      </footer>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
